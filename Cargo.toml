[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HenriqueArtur/bancada"
authors = ["Henrique Artur"]

# Single source of version truth. A member pulls an internal crate with
# `foo = { workspace = true }` and never restates a path, so the crate graph
# below is the whole graph — which is what makes hard rules 1 and 2 checkable
# by reading one file.
[workspace.dependencies]
bancada-meta    = { path = "crates/bancada-meta" }
bancada-events  = { path = "crates/bancada-events" }
bancada-runtime = { path = "crates/bancada-runtime" }
bancada-rules   = { path = "crates/bancada-rules" }
bancada-adapter-claude = { path = "crates/bancada-adapter-claude" }

# --- external ---------------------------------------------------------------
# Pinned exactly (`=`), not by caret. A lockfile already fixes what *this*
# checkout builds; the pin fixes what a fresh `cargo add` or a dependant
# resolves to, so "works on my machine" and "works in CI" cannot diverge by a
# patch release nobody chose. Upgrades are a commit, with a name on them.
serde      = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono     = { version = "=0.4.45", default-features = false, features = ["std"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types   = "deny"
