[package]
name = "bancada-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bancada-meta = { workspace = true }
# A question crosses the seam so the window can draw it as the cards it
# already is in the log. Only `Question` is serialised — `Event` is not, and
# a whole log has no business being handed to a screen.
[dependencies.serde]
workspace = true
features = ["derive"]

